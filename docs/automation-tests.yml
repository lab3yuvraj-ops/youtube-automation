# CI template: move this file to .github/workflows/automation-tests.yml
# using an account/token with GitHub workflow permission to enable it.
name: Cross-platform automation checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: production/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - run: npm run typecheck
      - run: npm test
      - run: node ../start-video.mjs --help
